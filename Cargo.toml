[workspace]
members = ["crates/ferrisearch-core", "napi", "wasm"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev-fast]
inherits = "release"
codegen-units = 16

[profile.dev-napi]
inherits = "dev-fast"
