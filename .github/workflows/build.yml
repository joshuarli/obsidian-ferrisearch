name: Build prerelease

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-15
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build WASM bindings
        run: make build-wasm
      - name: Check plugin
        run: pnpm run lint:check && pnpm run typecheck && pnpm run test
      - name: Build plugin archive
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: ferrisearch
          path: ferrisearch.zip
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: prerelease-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from $GITHUB_SHA." \
            --prerelease \
            ferrisearch.zip
