[package]
name = "ferrisearch-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["filesystem"]
filesystem = ["tantivy/mmap"]

[dependencies]
tantivy = { version = "0.27", default-features = false, features = ["lz4-compression"] }
regex = "1"
unicode-normalization = "0.1"
deser = { version = "0.10", default-features = false, features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
deser-json = { version = "0.10", default-features = false, features = ["speedups"] }
tempfile = "3"
