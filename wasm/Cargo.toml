[package]
name = "ferrisearch-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferrisearch-core = { path = "../crates/ferrisearch-core", default-features = false }
serde = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"
serde-wasm-bindgen = "0.6"
