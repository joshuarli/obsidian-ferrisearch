[workspace]
members = ["crates/ferrisearch-core", "napi", "wasm"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.dev-napi]
inherits = "dev-fast"
