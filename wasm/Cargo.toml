[package]
name = "ferrisearch-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferrisearch-core = { path = "../crates/ferrisearch-core", default-features = false }
miniserde = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2.128"
uuid = { version = "1", features = ["js"] }

# tantivy pulls getrandom 0.3 via rand; its wasm_js backend needs both the
# feature (here) and the cfg (in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
