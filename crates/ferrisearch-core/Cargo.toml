[package]
name = "ferrisearch-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["filesystem"]
filesystem = ["tantivy/mmap"]

[dependencies]
tantivy = { version = "0.25", default-features = false, features = ["lz4-compression"] }
regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bench]]
name = "query"
harness = false
