repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: bunx biome check --write --max-diagnostics=50
        language: system
        types_or: [ts, javascript]
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
