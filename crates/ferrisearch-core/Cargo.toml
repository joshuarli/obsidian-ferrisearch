[package]
name = "ferrisearch-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tantivy = { version = "0.25", default-features = false, features = ["mmap", "lz4-compression"] }
regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
