name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.108
      - run: bun install --frozen-lockfile

      # Lint
      - run: bunx biome check .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Test
      - run: cargo test --all
      - run: bun test
      - run: WASM_BINDGEN_TEST_ONLY_NODE=1 cargo test -p ferrisearch-wasm --target wasm32-unknown-unknown

  # --- Release (only on version tags) ---

  build-native:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin
      - name: Build native binary
        run: cargo build --release -p ferrisearch-napi --target aarch64-apple-darwin
      - name: Rename native binary to .node
        run: cp target/aarch64-apple-darwin/release/libferrisearch_napi.dylib ferrisearch.darwin-arm64.node
      - uses: actions/upload-artifact@v4
        with:
          name: ferrisearch.darwin-arm64.node
          path: ferrisearch.darwin-arm64.node

  build-plugin:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.108
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p ferrisearch-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir wasm/pkg target/wasm32-unknown-unknown/release/ferrisearch_wasm.wasm
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/ferrisearch_wasm_bg.wasm

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-native, build-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/plugin-dist/* release/
          cp artifacts/ferrisearch.darwin-arm64.node/ferrisearch.darwin-arm64.node release/
          ls -lh release/
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft release/*
